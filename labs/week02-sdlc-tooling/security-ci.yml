name: week02-security-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Report Semgrep findings
        run: semgrep scan --config p/default --config p/owasp-top-ten --sarif --output semgrep.sarif || true
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: week02-semgrep
      - name: Gate on Semgrep findings
        run: semgrep scan --config p/default --config p/owasp-top-ten --error

  trivy:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: week02-trivy
      - name: Gate on HIGH and CRITICAL findings
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report secret findings
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect -s /repo --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 0 || true
      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: week02-gitleaks
      - name: Gate on secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect -s /repo --exit-code 1
